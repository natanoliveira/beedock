name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_URL: http://localhost:3004
      AUDIT_HMAC_KEY: ci-audit-key-ci-audit-key-ci-audit-key
      BLOB_READ_WRITE_TOKEN: ci
      ENABLE_SIGNUP: "false"
      # Isolamento entre empresas: branch de teste do Neon (secrets do repositório)
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations no banco de teste
        if: ${{ env.TEST_DIRECT_URL != '' }}
        run: pnpm prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      - run: pnpm test
      - run: pnpm build
